[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-tray"
version = "0.1.0"
description = "Tray icons with battery percentage for Bluetooth devices and Logitech wireless mice (Windows)"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.gui-scripts]
battery-tray = "battery_tray.app:main"

[tool.setuptools]
packages = ["battery_tray"]
